spring.datasource.sqlScriptEncoding=UTF-8
spring.datasource.driverClassName=org.hsqldb.jdbc.JDBCDriver

# SpringのDBのデータソース
## 2026/10/20 DBのファイルをプロジェクトのファイルツリーから外に出す
#### spring.datasource.url=jdbc:hsqldb:file:./LoulanDNS/db/HSQLDB/LoulanDNS/LoulanDNS
## 2026/10/20 デフォルトのDBアクセス先をHSQLDBのサーバーモードに変更する.
#### spring.datasource.url=jdbc:hsqldb:file:./LoulanDNS/../data/db/HSQLDB/LoulanDNS/LoulanDNS
spring.datasource.url=jdbc:hsqldb:hsql://localhost/LoulanDNS


spring.datasource.username=loulan
spring.datasource.password=loulan

jpa.hibernate.ddl-auto=validate

##### JPQLのデバッグ用出力設定
# logging.level.sql=debug



##### WebAPIのレスポンスをGZIP圧縮する設定
server.compression.enabled=true
# NDJSONのMedia Type（application/x-ndjson）を圧縮対象に含める
server.compression.mime-types=application/json,application/xhtml+xml,text/html,text/xml,text/plain,application/x-ndjson
# 圧縮を適用する最小サイズ（バイト）
server.compression.min-response-size=1024


# PIDファイル出力設定
##### Springアプリケーションの起動完了時に指定したパスにPIDファイルを出力する.
spring.pid.file=application.pid









